<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>
<style>
:root {
  --bg: #f6f3ee; --panel: #fffdf9; --ink: #2a2622; --muted: #6f675e; --line: #e4ddd2;
  --accent: #7a4b1f; --accent-soft: #f1e6d8; --chip: #efe9e0; --chip-on: #7a4b1f; --chip-on-ink: #fff;
  --ok: #2f6b3a; --ok-soft: #e3efe2; --warn: #8a5a00; --warn-soft: #fbf0d6; --bad: #9b2c24; --bad-soft: #f8e1de;
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 2px 8px rgba(60,40,20,.05);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #1b1916; --panel: #24211d; --ink: #ece6dd; --muted: #a59c90; --line: #3a352f;
    --accent: #e0a868; --accent-soft: #3a2e22; --chip: #302c27; --chip-on: #e0a868; --chip-on-ink: #1b1916;
    --ok: #8fd19e; --ok-soft: #1f3324; --warn: #f0c060; --warn-soft: #3a3020; --bad: #f19a90; --bad-soft: #3d2220; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1916; --panel: #24211d; --ink: #ece6dd; --muted: #a59c90; --line: #3a352f;
  --accent: #e0a868; --accent-soft: #3a2e22; --chip: #302c27; --chip-on: #e0a868; --chip-on-ink: #1b1916;
  --ok: #8fd19e; --ok-soft: #1f3324; --warn: #f0c060; --warn-soft: #3a3020; --bad: #f19a90; --bad-soft: #3d2220; --shadow: none;
}
:root[data-theme="sepia"] {
  --bg: #f1e7d0; --panel: #f8f0dc; --ink: #3b2f1e; --muted: #7a6a52; --line: #dccdaa;
  --accent: #8a4b14; --accent-soft: #ead9b6; --chip: #e8dbbd; --chip-on: #8a4b14; --chip-on-ink: #fff8ea; --shadow: none;
}
:root[data-theme="contrast"] {
  --bg: #000; --panel: #0a0a0a; --ink: #fff; --muted: #d6d6d6; --line: #8a8a8a;
  --accent: #ffd400; --accent-soft: #2b2400; --chip: #1c1c1c; --chip-on: #ffd400; --chip-on-ink: #000;
  --ok: #7dff9a; --ok-soft: #002b0b; --warn: #ffd400; --warn-soft: #2b2400; --bad: #ff8a80; --bad-soft: #300; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0; font: 600 21px var(--serif); color: var(--accent); }
header .sp { flex: 1; }
.langs button { border: 1px solid var(--line); background: var(--chip); padding: 3px 9px; border-radius: 6px; cursor: pointer; }
.langs button.on { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
main { display: grid; grid-template-columns: 236px 1fr; height: calc(100% - 55px - 52px); }
nav { border-right: 1px solid var(--line); padding: 12px 8px; overflow: auto; background: var(--panel); }
nav a { display: flex; gap: 9px; align-items: center; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; cursor: pointer; }
nav a .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--chip); flex: none; }
nav a.done .num { background: var(--ok-soft); color: var(--ok); }
nav a.on { background: var(--accent-soft); font-weight: 600; }
nav a.on .num { background: var(--accent); color: var(--chip-on-ink); }
nav hr { border: 0; border-top: 1px solid var(--line); margin: 10px 4px; }
#vista { overflow: auto; padding: 22px 28px 40px; }
section { display: none; max-width: 1180px; }
section#s-proposte { max-width: none; }
section.on { display: block; }
h2 { font: 600 24px var(--serif); margin: 0 0 6px; }
h3 { font: 600 17px var(--serif); margin: 22px 0 8px; }
.intro { color: var(--muted); margin: 0 0 18px; max-width: 820px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 600; margin-bottom: 4px; }
.field .hint { color: var(--muted); font-size: 13px; margin-top: 3px; }
input[type=text], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
input[type=text] { min-width: 0; }
.path { flex: 1; min-width: 280px; }
.btn { border: 1px solid var(--line); background: var(--chip); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--chip-on-ink); border-color: var(--accent); font-weight: 600; }
.btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.list { list-style: none; margin: 6px 0; padding: 0; }
.list li { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
.list li code { flex: 1; background: var(--bg); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); word-break: break-all; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 10px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.stat b { display: block; font: 600 24px var(--serif); }
.stat span { color: var(--muted); font-size: 13px; }
.msg { padding: 10px 14px; border-radius: 9px; margin: 10px 0; }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg ul { margin: 6px 0 0; padding-left: 20px; }
table { border-collapse: collapse; width: 100%; background: var(--panel); }
th, td { border-bottom: 1px solid var(--line); padding: 5px 7px; text-align: left; vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel); font-size: 12.5px; color: var(--muted); z-index: 1; }
td input[type=text] { width: 100%; padding: 3px 6px; }
td select { max-width: 190px; padding: 3px 4px; }
tr.sel td { background: var(--accent-soft); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chip { border: 1px solid var(--line); background: var(--chip); padding: 3px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.chip.on { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.flag { display: inline-block; font-size: 11.5px; padding: 0 6px; border-radius: 5px; background: var(--warn-soft); color: var(--warn); margin: 1px 2px 0 0; }
.conf { font-size: 11.5px; color: var(--muted); }
.conf.low { color: var(--bad); font-weight: 600; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 1150px) { .split { grid-template-columns: minmax(0, 1fr); } #det { position: static; max-height: none; } }
.split.nodet { grid-template-columns: minmax(0, 1fr); } .split.nodet #det { display: none; }
#det .chiudi { float: right; }
#tab select[data-f=decisione] { max-width: 140px; } #tab select[data-f=categoria] { max-width: 175px; }
#det { position: sticky; top: 0; max-height: calc(100vh - 150px); overflow: auto; }
#det img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; }
#det pre { white-space: pre-wrap; font: 12.5px/1.45 var(--sans); background: var(--bg); padding: 8px; border-radius: 6px; max-height: 260px; overflow: auto; }
.svc { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.svc label { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--panel); }
.svc label.on { border-color: var(--accent); background: var(--accent-soft); }
.svc input { margin-right: 6px; }
.svc small { display: block; color: var(--muted); margin-top: 3px; }
ol.steps { padding-left: 20px; } ol.steps li { margin: 7px 0; }
footer { height: 52px; border-top: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 12px; padding: 0 18px; }
#bar { flex: 1; height: 10px; background: var(--chip); border-radius: 6px; overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
#jobtxt { min-width: 260px; max-width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.pager { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.small { font-size: 12.5px; color: var(--muted); }
details summary { cursor: pointer; font-weight: 600; }
.guide p, .guide li { max-width: 820px; }
</style>
</head>
<body>
<header>
  <h1>📚 Biblioteca</h1>
  <span class="small" id="ver"></span>
  <span class="sp"></span>
  <span class="langs"><button data-l="it">IT</button> <button data-l="en">EN</button> <button data-l="es">ES</button></span>
</header>
<main>
  <nav id="nav"></nav>
  <div id="vista">

<section id="s-cartelle">
  <h2 data-t="cartelle"></h2><p class="intro" data-t="cartelleIntro"></p>
  <div class="card">
    <div class="field"><label data-t="fBib"></label>
      <div class="row"><input type="text" class="path" id="fBib" readonly><button class="btn" data-pick="biblioteca" data-t="scegli"></button></div>
      <div class="hint" data-t="fBibH"></div></div>
    <div class="field"><label data-t="fSorg"></label><ul class="list" id="lSorg"></ul>
      <button class="btn" data-add="sorgenti" data-t="aggiungi"></button><div class="hint" data-t="fSorgH"></div></div>
    <div class="field"><label data-t="fProt"></label><ul class="list" id="lProt"></ul>
      <button class="btn" data-add="protette" data-t="aggiungi"></button><div class="hint" data-t="fProtH"></div></div>
    <details><summary data-t="altreCartelle"></summary>
      <div class="field" style="margin-top:10px"><label data-t="fDup"></label>
        <div class="row"><input type="text" class="path" id="fDup" readonly><button class="btn" data-pick="duplicati" data-t="scegli"></button></div></div>
      <div class="field"><label data-t="fAltri"></label>
        <div class="row"><input type="text" class="path" id="fAltri" readonly><button class="btn" data-pick="altri_file" data-t="scegli"></button></div></div>
    </details>
  </div>
  <div id="mCartelle"></div>
  <button class="btn pri" data-go="inventario" data-t="avanti"></button>
</section>

<section id="s-inventario">
  <h2 data-t="inventario"></h2><p class="intro" data-t="inventarioIntro"></p>
  <div class="row"><button class="btn pri" id="bInv" data-t="avviaInv"></button><span class="small" data-t="soloLettura"></span></div>
  <div id="rInv"></div>
</section>

<section id="s-duplicati">
  <h2 data-t="duplicati"></h2><p class="intro" data-t="duplicatiIntro"></p>
  <div id="rDup"></div>
</section>

<section id="s-ai">
  <h2 data-t="ai"></h2><p class="intro" data-t="aiIntro"></p>
  <div class="svc" id="svc"></div>
  <div class="card" id="aiGuida" style="margin-top:14px"></div>
  <div class="card" id="aiAvvio"></div>
</section>

<section id="s-proposte">
  <h2 data-t="proposte"></h2><p class="intro" data-t="proposteIntro"></p>
  <div class="row">
    <div class="chips" id="filtri"></div><span class="sp" style="flex:1"></span>
    <input type="text" id="cerca" style="width:220px">
  </div>
  <div class="row small" id="bulk"></div>
  <p class="small" data-t="scegliRiga"></p>
  <div class="split nodet">
    <div><div class="pager" id="pag1"></div><div style="overflow:auto"><table id="tab"></table></div><div class="pager" id="pag2"></div></div>
    <div class="card" id="det"></div>
  </div>
</section>

<section id="s-simula">
  <h2 data-t="simula"></h2><p class="intro" data-t="simulaIntro"></p>
  <div class="row"><button class="btn" id="bPiano" data-t="costruisci"></button><button class="btn pri" id="bSim" data-t="avviaSim"></button></div>
  <div id="rPiano"></div><div id="rSim"></div>
</section>

<section id="s-esegui">
  <h2 data-t="esegui"></h2><p class="intro" data-t="eseguiIntro"></p>
  <div class="card"><label><input type="checkbox" id="approvo"> <span data-t="approvo"></span></label></div>
  <button class="btn bad" id="bEse" data-t="avviaEse"></button>
  <div id="rEse"></div>
</section>

<section id="s-catalogo">
  <h2 data-t="catalogo"></h2><p class="intro" data-t="catalogoIntro"></p>
  <div class="card"><h3 data-t="catTit"></h3><div class="row"><button class="btn pri" id="bCat" data-t="aggCat"></button><button class="btn" id="bApriCat" data-t="apriCat"></button></div><div id="rCat"></div></div>
  <div class="card"><h3 data-t="xlTit"></h3><div class="row"><button class="btn" id="bXl" data-t="creaXl"></button><button class="btn" id="bDec" data-t="creaDec"></button></div><div id="rXl"></div></div>
</section>

<section id="s-annulla">
  <h2 data-t="annulla"></h2><p class="intro" data-t="annullaIntro"></p>
  <div id="rLog"></div><div id="rAnn"></div>
</section>

<section id="s-impostazioni">
  <h2 data-t="impostazioni"></h2>
  <div class="card"><div class="row">
    <div class="field"><label data-t="tema"></label><select id="tema"></select></div>
    <div class="field"><label data-t="soglia"></label><input type="number" id="soglia" min="0.3" max="0.99" step="0.05" style="width:90px"><div class="hint" data-t="sogliaH"></div></div>
  </div></div>
  <div class="card"><h3 data-t="categorie"></h3><p class="small" data-t="categorieH"></p>
    <table id="tCat"></table><div class="row" style="margin-top:8px"><button class="btn" id="bCatAdd" data-t="aggiungi"></button><button class="btn pri" id="bCatSalva" data-t="salva"></button></div></div>
  <div class="card"><h3 data-t="esclusioni"></h3><p class="small" data-t="esclusioniH"></p>
    <ul class="list" id="lEsc"></ul><div class="row"><input type="text" id="nuovaEsc"><button class="btn" id="bEscAdd" data-t="aggiungi"></button></div></div>
</section>

<section id="s-guida" class="guide">
  <h2 data-t="guida"></h2><p><button class="btn pri" id="bManuale" data-t="manuale"></button></p><div id="guidaTesto"></div>
</section>

  </div>
</main>
<footer><span id="jobtxt"></span><div id="bar"><i></i></div><button class="btn small" id="bStop" data-t="interrompi" disabled></button></footer>

  <li><b>Cartelle</b>: scegli la Biblioteca (anche vuota), le cartelle da ordinare e quelle protette.</li>
  <li><b>Inventario</b>: il programma legge i file, senza spostare niente. Si può interrompere e riprendere.</li>
  <li><b>Duplicati</b>: vedi le copie identiche e i probabili doppioni.</li>
  <li><b>Titoli con l'AI</b> (facoltativo): scegli un'AI gratuita o la tua chiave e lasciala lavorare.</li>
  <li><b>Proposte</b>: controlla categorie, collezioni, titoli e autori. In alto i casi incerti. Clicca una riga per vedere la copertina.</li>
  <li><b>Simulazione</b>: il programma controlla ogni spostamento senza toccare niente.</li>
  <li><b>Esecuzione</b>: approvi e il programma sposta i file, poi verifica che siano tutti al loro posto.</li>
  <li><b>Catalogo ed Excel</b>: aggiorna il catalogo e crea l'elenco con ISBN e codici a barre.</li></ol>
  <h3>Regole di sicurezza</h3><ul><li>Il programma <b>non cancella mai</b> nessun file e non sovrascrive mai.</li>
  <li>Le cartelle protette non vengono mai lette né toccate.</li><li>Ogni esecuzione ha un log: con «Annulla un'esecuzione» tutto torna come prima.</li></ul>
  <h3>Libri nuovi</h3><p>Copia i libri nuovi in una cartella, mettila tra quelle da ordinare e rifai i passi. I libri già presenti in Biblioteca vengono riconosciuti e restano dove sono.</p>
  <h3>Nomi dei file</h3><p><code>Categoria\\Prefisso - Titolo, sottotitolo - Autore.pdf</code>; nelle collezioni <code>Categoria\\Collezione\\Prefisso - Collezione 03, Titolo - Autore.pdf</code>. Se un nome è già usato si aggiunge «(otra copia)».</p>`,

  SIM = !r.problemi.length;
  $("#rSim").innerHTML = SIM ? msg("ok", esc(t("simOk")) + ` <button class="btn small pri" data-go="esegui">${esc(t("avanti"))}</button>`)
    : msg("bad", `<b>${esc(t("simNo"))}</b><ul>${r.problemi.slice(0, 50).map(p => `<li>n.${p.n}: ${esc(p.problemi.join("; "))}<br><span class="small">${esc(p.da)}</span></li>`).join("")}</ul>`);
}
function fineEsegui(s) {
  if (s.errore) { $("#rEse").innerHTML = msg("bad", esc(s.errore)); return; }
  const r = s.risultato, v = r.verifica || {errori: []};
  SIM = null; $("#approvo").checked = false;
  $("#rEse").innerHTML = msg(r.problemi.length ? "bad" : "ok", `<b>${num(r.spostati)}</b> ${esc(t("spostati"))}${r.interrotto ? " · " + esc(t("interrotto")) : ""}`)
    + (v.errori.length ? msg("bad", `<b>${esc(t("verNo"))}</b><ul>${v.errori.slice(0, 50).map(e => `<li>${esc(e)}</li>`).join("")}</ul>`) : msg("ok", esc(t("verOk"))))
    + `<p>${esc(t("dopoEse"))} <button class="btn pri" data-go="catalogo">${esc(t("avanti"))}</button></p>`;
}

// ---------------------------------------------------------------- annulla
async function mostraLog() {
  await aggiornaInfo();
  $("#rLog").innerHTML = INFO.log.length ? `<table>${INFO.log.map(l => `<tr><td>${esc(l.log.split(/[\\/]/).pop())}</td><td>${num(l.spostati)} ${esc(t("spostati"))}</td>
    <td>${l.annullato ? `<span class="flag">${esc(t("giaAnn"))}</span>` : `<button class="btn small" data-ann="${esc(l.log)}" data-reale="0">${esc(t("provaAnn"))}</button> <button class="btn small bad" data-ann="${esc(l.log)}" data-reale="1">${esc(t("annDavvero"))}</button>`}</td></tr>`).join("")}</table>`
    : msg("ok", esc(t("nessunLog")));
}

// ---------------------------------------------------------------- impostazioni
function mostraImpostazioni() {
  $("#soglia").value = INFO.imp.soglia_sicura;
  const c = INFO.imp.categorie;
  $("#tCat").innerHTML = `<tr><th>${esc(t("cNome"))}</th><th>${esc(t("cPref"))}</th><th>${esc(t("cDescr"))}</th><th></th></tr>` + Object.entries(c).map(([k, v]) =>
    `<tr><td><input type="text" class="cn" value="${esc(k)}"></td><td><input type="text" class="cp" value="${esc(v.prefisso)}"></td><td><input type="text" class="cd" value="${esc(v.descrizione)}"></td><td><button class="btn small" data-delcat>×</button></td></tr>`).join("");
  $("#lEsc").innerHTML = INFO.imp.esclusioni.map((m, k) => `<li><code>${esc(m)}</code><button class="btn small" data-delesc="${k}">${esc(t("togli"))}</button></li>`).join("");
}
function applicaTema(v) { if (v === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = v; }

// ---------------------------------------------------------------- eventi
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-v],[data-go],[data-l],[data-pick],[data-add],[data-del],[data-open],[data-link],[data-filtro],[data-pag],[data-row],[data-scarica],[data-prova],[data-salvachiave],[data-togli],[data-numera],[data-ann],[data-delcat],[data-delesc],button,input[type=radio]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.v || ds.go) return vai(ds.v || ds.go);
  if (ds.l) { L = ds.l; await API.salva_impostazioni({lingua: L}); traduci(); return vai(VISTA); }
  if (ds.pick) { const p = await API.scegli_cartella(); if (p) salvaImp({[ds.pick]: p}); return; }
  if (ds.add) { const p = await API.scegli_cartella(); if (p && !INFO.imp[ds.add].includes(p)) salvaImp({[ds.add]: [...INFO.imp[ds.add], p]}); return; }
  if (ds.del) { const a = [...INFO.imp[ds.del]]; a.splice(+ds.k, 1); return salvaImp({[ds.del]: a}); }
  if (ds.open) return API.apri(ds.open);
  if (ds.link) return API.apri_link(ds.link);
  if (ds.filtro) { FILTRO = ds.filtro; PAG = 0; SEL.clear(); return elenco(); }
  if (ds.pag) { PAG += +ds.pag; return elenco(); }
  if (ds.scarica) return avvia(API.ai_scarica(ds.scarica), () => mostraAI());
  if (ds.prova) { $("#esitoProva").textContent = "…"; const r = await API.ai_prova(ds.prova, AIS.modello || ""); $("#esitoProva").innerHTML = r.ok ? `<span style="color:var(--ok)">✓ ${esc(t("provaOk"))}</span>` : `<span style="color:var(--bad)">✗ ${esc(t("provaNo"))}: ${esc(r.messaggio)}</span>`; return; }
  if (ds.salvachiave) { const r = await API.ai_salva_chiave(ds.salvachiave, $("#chiave").value); if (!r.ok) alert(t("chiaveNo")); $("#chiave").value = ""; return mostraAI(); }
  if (ds.togli) { AIS = await API.ai_togli_chiave(ds.togli); return mostraAI(); }
  if (ds.numera) { const [c, k] = ds.numera.split("|"); const n = await API.numera(c, k); alert(`${n} ${t("numerati")}`); return elenco(); }
  if (ds.ann) { if (ds.reale === "1" && !confirm(t("confAnn"))) return; return avvia(API.annulla(ds.ann, ds.reale === "1"), s => { $("#rAnn").innerHTML = s.errore ? msg("bad", esc(s.errore)) : msg("ok", `${num(s.risultato.ok)} ${esc(t(ds.reale === "1" ? "ripristinati" : "daRipristinare"))}, ${num(s.risultato.saltati)} ${esc(t("saltati"))}`); mostraLog(); }); }
  if (ds.delcat !== undefined) { el.closest("tr").remove(); return; }
  if (ds.delesc) { const a = [...INFO.imp.esclusioni]; a.splice(+ds.delesc, 1); INFO = await API.salva_impostazioni({esclusioni: a}); return mostraImpostazioni(); }
  if (el.name === "svc") { AIS = await API.ai_scegli(el.value, el.value === "claude" ? (AIS.modello || "claude-opus-5-5") : "", ""); return mostraAI(); }
  if (el.name === "ml") { AIS = await API.ai_scegli(AIS.servizio, "", el.value); return avvioAI(); }
  if (el.name === "mc") { AIS = await API.ai_scegli("claude", el.value, ""); return avvioAI(); }
  switch (el.id) {
    case "bInv":
      if (INFO.proposte && !confirm(t("rifaInv"))) return;
      return avvia(API.avvia_inventario(), fineInventario);
    case "bStop": return API.ferma();
    case "bManuale": return API.apri_manuale(L);
    case "bChiudiDet": DETN = null; $(".split").classList.add("nodet"); $$("#tab tr.sel").forEach(tr => tr.classList.remove("sel")); return;
    case "bImporta": return avvia(API.ai_importa(), () => mostraAI());
    case "bAI": return avvia(API.ai_avvia(AIS.servizio, AIS.modello || ""), s => { $("#rAI").innerHTML = s.errore ? msg("bad", esc(s.errore)) : msg("ok", `${esc(t("aiFatto"))}: ${num(s.risultato.fatti)} · ${esc(t("aiRestano"))} ${num(s.risultato.restano)}`); avvioAI(); });
    case "bPiano": return costruisciPiano();
    case "bSim": { const r = await costruisciPiano(); if (r && !r.errori.length) avvia(API.simula(), fineSimula); return; }
    case "bEse":
      if (!SIM || !$("#approvo").checked) return alert(t("serveSim"));
      if (!confirm(t("confEse"))) return;
      return avvia(API.esegui("ESEGUI"), fineEsegui);
    case "bCat": return avvia(API.catalogo(), s => { const r = s.risultato || {}; $("#rCat").innerHTML = s.errore ? msg("bad", esc(s.errore)) : r.interrotto ? msg("warn", esc(t("interrotto"))) : msg("ok", `${num(r.libri)} ${esc(t("libri"))} · ${num(r.con_prologo)} ${esc(t("conProl"))} · ${num(r.con_isbn)} ${esc(t("conIsbn"))} · ${num(r.kb)} KB`); });
    case "bApriCat": return API.apri(INFO.cartelle.biblioteca + "\\Catalogo.html");
    case "bXl": return avvia(API.elenco_isbn(), s => { const r = s.risultato || {}; $("#rXl").innerHTML = s.errore ? msg("bad", esc(s.errore)) : msg("ok", `${num(r.libri)} ${esc(t("libri"))} · ${num(r.con_isbn)} ${esc(t("conIsbn"))} · ${num(r.con_edizione)} ${esc(t("conEd"))} <button class="btn small" data-open="${esc(r.file)}">${esc(t("apriXl"))}</button>`); });
    case "bDec": { const p = await API.da_decidere(); if (p) API.apri(p); return; }
    case "bCatAdd": $("#tCat").insertAdjacentHTML("beforeend", `<tr><td><input type="text" class="cn"></td><td><input type="text" class="cp"></td><td><input type="text" class="cd"></td><td><button class="btn small" data-delcat>×</button></td></tr>`); return;
    case "bCatSalva": { const c = {}; $$("#tCat tr").forEach(tr => { const n = $(".cn", tr); if (n && n.value.trim()) c[n.value.trim()] = {prefisso: $(".cp", tr).value, descrizione: $(".cd", tr).value}; }); await API.categorie_salva(c); await aggiornaInfo(); return mostraImpostazioni(); }
    case "bEscAdd": { const v = $("#nuovaEsc").value.trim(); if (v) { INFO = await API.salva_impostazioni({esclusioni: [...INFO.imp.esclusioni, v]}); $("#nuovaEsc").value = ""; mostraImpostazioni(); } return; }
  }
  if (ds.row && e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT") return dettaglio(+ds.row);
});
document.addEventListener("change", async e => {
  const el = e.target, ds = el.dataset;
  if (ds.sel) { el.checked ? SEL.add(+ds.sel) : SEL.delete(+ds.sel); return bulk(); }
  if (el.id === "selAll") { $$("[data-sel]").forEach(c => { c.checked = el.checked; el.checked ? SEL.add(+c.dataset.sel) : SEL.delete(+c.dataset.sel); }); return bulk(); }
  if (ds.n && ds.f) {
    const r = await API.aggiorna(+ds.n, ds.f, el.value);
    if (ds.f === "categoria") { const conf = el.parentElement.querySelector(".conf"); if (conf) { conf.textContent = "✓"; conf.classList.remove("low"); } }
    if (VISTA === "duplicati") mostraDuplicati();
    if (DETN === +ds.n) dettaglio(+ds.n);
    return r;
  }
  if (el.id === "fCat") { FILTRO = el.value ? "cat:" + el.value : "controllare"; PAG = 0; return elenco(); }
  if (el.id === "bulkDec" || el.id === "bulkCat" || el.id === "bulkEsc") {
    if (!el.value) return;
    const nums = [...SEL];
    if (el.id === "bulkDec") await API.aggiorna_molti(nums, "decisione", el.value);
    if (el.id === "bulkCat") await API.aggiorna_molti(nums, "categoria", el.value);
    if (el.id === "bulkEsc") { await API.aggiorna_molti(nums, "decisione", "NON_IMPORTARE"); await API.aggiorna_molti(nums, "motivo", el.value); }
    SEL.clear(); return elenco();
  }
  if (el.id === "tema") { localStorage.setItem("biblioteca.tema", el.value); return applicaTema(el.value); }
  if (el.id === "soglia") { INFO = await API.salva_impostazioni({soglia_sicura: +el.value}); return; }
});
let tCerca = null;
document.addEventListener("input", e => { if (e.target.id === "cerca") { clearTimeout(tCerca); tCerca = setTimeout(() => { CERCA = e.target.value; PAG = 0; elenco(); }, 300); } });

window.addEventListener("pywebviewready", async () => {
  API = window.pywebview.api;
  try { applicaTema(localStorage.getItem("biblioteca.tema") || "auto"); } catch (_) {}
  await aggiornaInfo();
  L = INFO.imp.lingua || "it";
  traduci();
  vai(INFO.proposte ? "proposte" : INFO.inventario ? "duplicati" : "cartelle");
  const s = await API.stato_lavoro(); if (s && !s.finito) avvia(Promise.resolve({ok: true}), null);
});
</script>
</body>
</html>
